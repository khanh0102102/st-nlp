name: ST-NLP CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "feature/**"
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: stnlp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application and test images
        run: docker compose --profile test build

      - name: Run database migration, seed and backend tests
        run: docker compose --profile test run --rm api-test

      - name: Run neural model tests in the CPU training image
        run: docker compose --profile test run --rm --no-deps ml-test

      - name: Smoke-test the ML trainer CLI
        run: docker compose --profile training run --rm --no-deps --build ml-trainer

      - name: Start application stack
        run: docker compose up -d

      - name: Verify frontend and API health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/health >/dev/null \
              && curl --fail --silent http://localhost:8080/health/live >/dev/null \
              && curl --fail --silent http://localhost:8080/health/ready >/dev/null; then
              echo "Frontend, API liveness and API readiness passed."
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Collect service status on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Clean up ephemeral CI volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
